# The steelworks example's locale file, and the locale checker's fixture.
#
# It carries an entry for every setting the example guests declare, INCLUDING
# the customizer's: a name for each, a description for each text setting and
# for each dropdown that has a custom arm (the checker requires both, because a
# free-text field with no explanation is a field nobody can fill in and a
# composed preset list has nowhere to hang), and a [string-mod-setting] entry
# for every dropdown value, custom among them.
#
# It is then DELIBERATELY WRONG in four ways, one per class the checker exists
# to catch, so that testdata/locale/findings.golden pins the exact sentences
# both language halves produce over the same bytes:
#
#   * bonus-research has no [mod-setting-name] entry   (a name the player cannot read)
#   * quench-medium's "oil" value has no entry          (a dropdown value with no fallback)
#   * scrap-recovery is named but declared nowhere      (a renamed setting's leftover)
#   * quench-medium-brine is a value nobody offers      (a renamed option's leftover)
#
; Both comment markers appear on purpose: the engine takes # and ; alike, and
; only at the start of a line.

