# The steelworks example's locale file, and the locale checker's fixture.
#
# It carries an entry for every setting the example guests declare, INCLUDING
# the customizer's: a name for each, a description for each text setting, each
# research number and each dropdown that has a text setting beside it (the
# checker requires all three, because a free-text field with no explanation is a
# field nobody can fill in, a number with no stated range is one nobody can
# guess, and a composed preset list has nowhere to hang), and a
# [string-mod-setting] entry for every dropdown value.
#
# It is then DELIBERATELY WRONG in five ways, one per class the checker exists
# to catch, so that testdata/locale/findings.golden pins the exact sentences
# both language halves produce over the same bytes:
#
#   * bonus-research has no [mod-setting-name] entry   (a name the player cannot read)
#   * quench-medium's "oil" value has no entry          (a dropdown value with no fallback)
#   * scrap-recovery is named but declared nowhere      (a renamed setting's leftover)
#   * quench-medium-brine is a value nobody offers      (a renamed option's leftover)
#   * hardened-tools has a description entry the plan   (dead text: the plan describes
#     describes inline                                   that setting itself, and the
#                                                        engine shows the plan's text)
#
# steelworks-scaffold-parts has no description entry on purpose and is NOT a
# defect: the plan describes it inline too, and an absent entry there is what
# the checker now expects. A present one would be the fifth finding again.
#
# THE ADVISORIES ARE NOT IN THAT GOLDEN AND MUST NOT BE. The cost dropdown
# composes the GAME's own technology-name keys into its preset lines, which this
# mod must not define (Factorio's locale namespace is flat, so defining one
# would rename that technology for every mod in the game); a key the game does
# not define degrades to the raw internal name rather than costing the tooltip,
# so there is nothing here to fix. Those notes are a report of their own,
# CheckLocaleAdvisories / check_locale_advisories, which reads no .cfg at all:
# nothing in this file makes them appear or go away, and each half pins them in
# its own suite.
#
; Both comment markers appear on purpose: the engine takes # and ; alike, and
; only at the start of a line.

