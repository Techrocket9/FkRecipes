fkrecipes-example-tips-research-tier=What a level of hardened tool tips costs to research.
fkrecipes-example-tempering-hold=Seconds to temper one salvaged plate back to workable.
fkrecipes-example-rivet-ingredients=What a batch of rivets is stamped from. Write the amount, then the item name, and separate ingredients with commas: 2 iron-plate, 3 copper-cable
fkrecipes-example-quench-ingredients=What the plate is quenched in while the medium above is set to custom. Write the amount, then the name, and separate ingredients with commas: 2 iron-plate, 0.5 water
fkrecipes-example-chain-links=How much rivet a length of chain takes.
fkrecipes-example-chain-ingredients=What a length of chain is forged from while the links above are set to custom. Write the amount, then the name, and separate ingredients with commas: 4 iron-plate, 0.5 water
fkrecipes-example-tips-packs=The science packs a level of hardened tool tips takes, while the cost above is set to custom. Write the amount, then the pack name, and separate packs with commas: 1 automation-science-pack, 1 military-science-pack
fkrecipes-example-tips-count=How many units of research one level of hardened tool tips takes.
fkrecipes-example-tips-seconds=Seconds per unit of hardened tool tips research.
fkrecipes-example-chain-packs=The science packs chain forging takes. Write the amount, then the pack name, and separate packs with commas: 1 automation-science-pack, 1 logistic-science-pack
