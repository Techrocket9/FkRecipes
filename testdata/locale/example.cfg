fkrecipes-example-tips-seconds=Seconds per unit of hardened tool tips research.
fkrecipes-example-chain-packs=The science packs chain forging takes. Write the amount, then the pack name, and separate packs with commas: 1 automation-science-pack, 1 logistic-science-pack
