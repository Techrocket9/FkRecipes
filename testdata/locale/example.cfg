# The steelworks example's locale file, and the locale checker's fixture.
#
# It is DELIBERATELY WRONG in four ways, one per class the checker exists to
# catch, so that testdata/locale/findings.golden pins the exact sentences both
# language halves produce over the same bytes:
#
#   * bonus-research has no [mod-setting-name] entry   (a name the player cannot read)
#   * quench-medium's "oil" value has no entry          (a dropdown value with no fallback)
#   * scrap-recovery is named but declared nowhere      (a renamed setting's leftover)
#   * quench-medium-brine is a value nobody offers      (a renamed option's leftover)
#
; Both comment markers appear on purpose: the engine takes # and ; alike, and
; only at the start of a line.

[mod-setting-name]
fkrecipes-example-hardened-tools=Hardened tools
fkrecipes-example-rivet-batch=Rivets per batch
fkrecipes-example-forging-time=Forging time
fkrecipes-example-quench-medium=Quenching medium
fkrecipes-example-scrap-recovery=Recover rivets from scrap

[mod-setting-description]
fkrecipes-example-hardened-tools=Adds the hardened steel line and the research that unlocks it.
fkrecipes-example-rivet-batch=How many rivets one stamping produces.
fkrecipes-example-forging-time=Seconds to quench and temper one plate.
fkrecipes-example-quench-medium=What the hot plate is dropped into.

[string-mod-setting]
fkrecipes-example-quench-medium-water=Water
fkrecipes-example-quench-medium-brine=Brine
