[package]
name = "fkrecipes"
version = "0.1.0"
edition = "2021"
description = "User-configurable crafting recipes and research for Factorio mods built with FkLua"
license = "MIT"
# cargo would otherwise scan examples/ for auto example targets of this
# package; the directory holds workspace members instead, and a stray main.rs
# would make one file both a member and an example.
autoexamples = false

[lib]
crate-type = ["rlib"]

# The fkdata dependency resolves from the FkLua repository; fkdata itself
# pulls in fk, which supplies the allocator. ONE SOURCE RULE: if your
# consumer uses a vendored FkLua checkout (a path dependency), they must
# [patch] this git source onto their path -- two fk crates in one build
# is a duplicate #[global_allocator] link error:
#
#   [patch."https://github.com/Techrocket9/fklua"]
#   fkdata = { path = "../FkLua/guest/rust/fkdata" }
#   fk     = { path = "../FkLua/guest/rust/fk" }
#
# WASM-GATED, the fkipc arrangement: on the host nothing here is compiled
# into the crate, which is what lets `cargo test` run the pure half (the
# planner, the validators) with no wasm target installed. Cargo still
# RESOLVES the whole graph first, so the git source is cloned even for a
# host test run; the gate needs the network once, not a wasm toolchain.
[target.'cfg(target_family = "wasm")'.dependencies]
fkdata = { git = "https://github.com/Techrocket9/fklua" }

# NEVER declare fk/fkgc here. Cargo unifies features across the consumer's
# whole build, so a library that turned the collector on would turn it on for
# every crate in the graph -- whether the mod is collected is the CONSUMER's
# decision.

[workspace]
resolver = "2"
members = ["examples/datastage"]

# The profile is not a preference: FkLua's guest workspace carries exactly
# this block, and the example guest built from this workspace root ships
# through fklua mod like any consumer's module would.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
